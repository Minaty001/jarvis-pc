[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-pc"
version = "1.0.0"
description = "JARVIS — Personal AI Voice Assistant for Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Shanu"}
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0,<4",
]

[project.optional-dependencies]
voice = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "miniaudio>=1.60.0",
    "edge-tts>=6.0.0",
    "vosk>=0.3.45",
]
scheduler = [
    "apscheduler>=3.10.0,<4",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "jarvis-pc[dev,scheduler]",
]

[project.scripts]
jarvis = "jarvis.cli.main:run_cli"

[tool.setuptools.packages.find]
where = ["src"]
