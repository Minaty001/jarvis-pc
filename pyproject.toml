[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "jarvis-pc"
version = "1.0.0"
description = "JARVIS — Personal AI Voice Assistant for Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shanu"}
]

dependencies = [
    # Voice
    "onnxruntime>=1.17.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.11.0",

    # LLM
    "httpx>=0.27.0",
    "groq>=0.11.0",

    # Memory
    "chromadb>=0.5.0",

    # UI
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "plyer>=2.1.0",

    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # Tools
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jarvis = "run:main"

[tool.setuptools.packages.find]
include = ["core*", "voice*", "memory*", "llm*", "tools*", "agents*", "skills*", "ui*", "config*"]
