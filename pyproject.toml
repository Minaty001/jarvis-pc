[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS Voice Assistant - Automatic Background Wake Word Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openwakeword>=0.4.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
]

[project.scripts]
jarvis = "main:main"
